# "The replicas": a single address (replicas:5432) that spreads CONNECTIONS
# between replica1 and replica2 in round-robin. It is the app's PG_REPLICAS.
global
  maxconn 1000

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

defaults
  mode tcp
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  default-server init-addr last,libc,none resolvers docker check inter 1s fall 2 rise 1

frontend replicas
  bind :5432
  default_backend replicas

backend replicas
  balance roundrobin
  server replica1 replica1:5432
  server replica2 replica2:5432
