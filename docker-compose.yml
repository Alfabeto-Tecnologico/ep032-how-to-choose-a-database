# Lab for the tutorial "how to choose a database" (delivery app).
# PostgreSQL 18: primary + 2 streaming replicas. ScyllaDB: 3 nodes, RF = 3.
# Start only what the scenario needs (rodar.sh does that); tear down with:
#   docker compose down -v
name: delivery-lab

x-pg: &pg
  build: ./postgres
  image: delivery-lab/postgres:18.6-netem
  cap_add: [NET_ADMIN]
  environment: &pg-env
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: delivery
    REPLICATOR_PASSWORD: replicator
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d delivery -q"]
    interval: 1s
    timeout: 3s
    retries: 120
  stop_grace_period: 5s

x-pg-args: &pg-args
  - postgres
  - -c
  - wal_level=replica
  - -c
  - max_wal_senders=10
  - -c
  - max_replication_slots=10
  - -c
  - hot_standby=on
  - -c
  - max_connections=200
  - -c
  - shared_buffers=256MB

# --max-networking-io-control-blocks 1000: the default (50000) reserves too much AIO per node and the
# third node does not fit in the Docker Desktop VM's fs.aio-max-nr (65536), which is shared.
# stop_grace_period: Scylla's clean shutdown (which writes the memtables) takes longer than the
# default 10 s; killed earlier, the node loses the writes still in the commitlog buffer (periodic mode).
x-scylla: &scylla
  image: scylladb/scylla:2026.3.4
  networks: [scylla_net]
  volumes: ["./scylla:/lab-scylla:ro"]
  stop_grace_period: 120s
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 120
    start_period: 30s

services:
  primary:
    <<: *pg
    hostname: primary
    command: *pg-args
    ports: ["127.0.0.1:54180:5432"]
    networks:
      app_net: {}
      replication_net:
        aliases: [primary-repl]
    volumes: [pg_primary:/var/lib/postgresql, ./sql:/lab-sql:ro]

  replica1:
    <<: *pg
    hostname: replica1
    entrypoint: ["replica-entrypoint.sh"]
    command: *pg-args
    environment:
      <<: *pg-env
      REPLICA_NAME: replica1
    ports: ["127.0.0.1:54181:5432"]
    networks: [app_net, replication_net]
    volumes: [pg_replica1:/var/lib/postgresql, ./sql:/lab-sql:ro]
    depends_on:
      primary: { condition: service_healthy }

  replica2:
    <<: *pg
    hostname: replica2
    entrypoint: ["replica-entrypoint.sh"]
    command: *pg-args
    environment:
      <<: *pg-env
      REPLICA_NAME: replica2
    ports: ["127.0.0.1:54182:5432"]
    networks: [app_net, replication_net]
    volumes: [pg_replica2:/var/lib/postgresql, ./sql:/lab-sql:ro]
    depends_on:
      primary: { condition: service_healthy }

  # PG_REPLICAS points here: round-robin of connections between replica1 and replica2.
  replicas:
    image: haproxy:3.2.25-alpine
    hostname: replicas
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    networks: [app_net]
    depends_on:
      replica1: { condition: service_healthy }
      replica2: { condition: service_healthy }

  # The TypeScript app runs in here (npx tsx), on the same network as the databases.
  app:
    image: node:22.23.4-bookworm-slim
    hostname: app
    init: true
    working_dir: /lab/app
    command: ["sleep", "infinity"]
    environment:
      PG_PRIMARY: postgres://postgres:postgres@primary:5432/delivery
      PG_REPLICAS: postgres://postgres:postgres@replicas:5432/delivery
      PG_REPLICA1: postgres://postgres:postgres@replica1:5432/delivery
      PG_REPLICA2: postgres://postgres:postgres@replica2:5432/delivery
      npm_config_update_notifier: "false"
    volumes:
      - ./:/lab
      - app_node_modules:/lab/app/node_modules
    networks: [app_net]

  scylla1:
    <<: *scylla
    hostname: scylla1
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --max-networking-io-control-blocks 1000 --seeds scylla1
    ports: ["127.0.0.1:59042:9042"]

  scylla2:
    <<: *scylla
    hostname: scylla2
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --max-networking-io-control-blocks 1000 --seeds scylla1
    depends_on:
      scylla1: { condition: service_healthy }

  scylla3:
    <<: *scylla
    hostname: scylla3
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --max-networking-io-control-blocks 1000 --seeds scylla1
    depends_on:
      scylla2: { condition: service_healthy }

networks:
  app_net:
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  replication_net:
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  scylla_net:
    ipam: { config: [{ subnet: 172.30.30.0/24 }] }

volumes:
  pg_primary:
  pg_replica1:
  pg_replica2:
  app_node_modules:
